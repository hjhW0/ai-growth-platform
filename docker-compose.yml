services:
  # ===== 后端 (Flask + 前端静态文件) =====
  backend:
    build: .
    container_name: ai-growth-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/growth_platform.db
      - FLASK_APP=app:app
    volumes:
      - app-data:/app/data

volumes:
  app-data:
    driver: local
